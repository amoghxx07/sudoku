<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sudoku Master</h1>
        <div id="sudoku-board" class="sudoku-board">
            <!-- 81 cells will be generated by JavaScript -->
        </div>
        <div class="controls">
            <button id="new-game">New Game</button>
            <button id="check-solution">Check Solution</button>
            <button id="solve-game">Solve</button>
            <button id="clear-board">Clear</button>
        </div>
        <div id="message" class="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
