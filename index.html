<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Sudoku - Analytical Mastery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">Zen Sudoku</div>
            <div class="game-info">
                <span id="difficulty-display">Medium</span>
                <span id="timer">00:00</span>
            </div>
        </header>

        <main>
            <section class="game-area">
                <div id="sudoku-board" class="sudoku-board">
                    <!-- 81 cells -->
                </div>
                
                <div class="numpad">
                    <button class="num-btn" data-val="1">1</button>
                    <button class="num-btn" data-val="2">2</button>
                    <button class="num-btn" data-val="3">3</button>
                    <button class="num-btn" data-val="4">4</button>
                    <button class="num-btn" data-val="5">5</button>
                    <button class="num-btn" data-val="6">6</button>
                    <button class="num-btn" data-val="7">7</button>
                    <button class="num-btn" data-val="8">8</button>
                    <button class="num-btn" data-val="9">9</button>
                    <button id="erase-btn" class="action-btn">Erase</button>
                </div>
            </section>

            <aside class="sidebar">
                <div class="controls-panel">
                    <select id="difficulty-select">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                    <button id="new-game-btn" class="primary-btn">New Game</button>
                </div>

                <div class="tools-panel">
                    <button id="note-mode-btn" class="toggle-btn">
                        Notes: <span id="note-status">OFF</span>
                    </button>
                    <button id="hint-btn" class="secondary-btn">Hint (Explain Logic)</button>
                </div>

                <div id="hint-display" class="hint-display">
                    <p class="hint-text">Select a cell to start.</p>
                </div>

                <div class="stats-panel">
                    <h3>Performance</h3>
                    <div class="stat-item">Games Won: <span id="stats-won">0</span></div>
                    <div class="stat-item">Best Time: <span id="stats-best">--:--</span></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Cheering Cat -->
    <div class="cat-cheerleader">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZxeXlzZ2x4Z3lzZ2x4Z3lzZ2x4Z3lzZ2x4Z3lzZ2x4Z3lpZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKMGpx6YJ5z5SgM/giphy.gif" alt="Dancing Cat">
        <div class="cat-bubble">Go for it! 🐾</div>
    </div>

    <script src="logic.js"></script>
    <script src="script.js"></script>
</body>
</html>
