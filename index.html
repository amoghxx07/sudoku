<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sreeta's Sudoku - Ultimate Mastery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="mode-focus theme-premium">
    <div class="app-container">
        <header>
            <div class="header-left">
                <div class="logo">Sreeta's Sudoku</div>
                <div class="mastery-badge">Level <span id="mastery-level">1</span>: <span id="mastery-rank">Novice</span></div>
            </div>
            <div class="header-right">
                <div id="pressure-info" class="hidden">
                    <span class="lives">Lives: <span id="lives-count">3</span></span>
                    <span class="streak-label">Streak: <span id="streak-count">0</span></span>
                </div>
                <div id="timer">00:00</div>
            </div>
        </header>

        <nav class="mode-selector">
            <button id="btn-focus" class="mode-btn active">Focus Mode</button>
            <button id="btn-pressure" class="mode-btn">High-Pressure</button>
            <button id="btn-challenge" class="mode-btn challenge-btn">Daily Challenge</button>
        </nav>

        <main>
            <section class="game-area">
                <div class="board-container">
                    <div id="sudoku-board" class="sudoku-board">
                        <!-- 81 cells -->
                    </div>
                    <div id="heatmap-overlay" class="heatmap-overlay hidden"></div>
                    <div id="ghost-layer" class="ghost-layer hidden"></div>
                </div>
                
                <div class="console-controls">
                    <div class="action-row">
                        <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)">⟲</button>
                        <button id="redo-btn" class="icon-btn" title="Redo (Ctrl+Y)">⟳</button>
                        <button id="notes-toggle-btn" class="icon-btn" title="Toggle Notes (N)">✎</button>
                        <button id="heatmap-toggle-btn" class="icon-btn" title="Heatmap Visibility">♨</button>
                    </div>
                    <div class="numpad">
                        <button class="num-btn" data-val="1">1</button>
                        <button class="num-btn" data-val="2">2</button>
                        <button class="num-btn" data-val="3">3</button>
                        <button class="num-btn" data-val="4">4</button>
                        <button class="num-btn" data-val="5">5</button>
                        <button class="num-btn" data-val="6">6</button>
                        <button class="num-btn" data-val="7">7</button>
                        <button class="num-btn" data-val="8">8</button>
                        <button class="num-btn" data-val="9">9</button>
                        <button id="erase-btn" class="num-btn erase">✖</button>
                    </div>
                </div>
            </section>

            <aside class="sidebar">
                <div class="learning-engine">
                    <h3>Learning Engine</h3>
                    <div id="hint-display" class="hint-display">
                        <p class="hint-text">Select a cell to analyze logic.</p>
                    </div>
                    <button id="hint-btn" class="secondary-btn">Explain Next Step</button>
                </div>

                <div class="performance-panel">
                    <h3>Performance Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric">
                            <label>Mistake Rate</label>
                            <span id="metric-error-rate">0%</span>
                        </div>
                        <div class="metric">
                            <label>Avg Solve</label>
                            <span id="metric-avg-time">--:--</span>
                        </div>
                    </div>
                    <div class="heatmap-legend">
                        <span>Slow</span>
                        <div class="gradient-bar"></div>
                        <span>Fast</span>
                    </div>
                </div>

                <div class="achievements-panel">
                    <h3>Achievements</h3>
                    <div id="achievement-list" class="achievement-list">
                        <!-- Badges -->
                    </div>
                </div>

                <div class="game-controls">
                    <button id="new-game-btn" class="primary-btn">Next Master Puzzle</button>
                    <button id="ghost-replay-btn" class="ghost-btn">Race Past Ghost</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Cheering Cat -->
    <div class="cat-cheerleader">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZxeXlzZ2x4Z3lzZ2x4Z3lzZ2x4Z3lzZ2x4Z3lzZ2x4Z3lpZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKMGpx6YJ5z5SgM/giphy.gif" alt="Dancing Cat">
        <div class="cat-bubble">Mastering Logic! 🐾</div>
    </div>

    <script src="logic.js"></script>
    <script src="script.js"></script>
</body>
</html>
